services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: simpledesk_app
    working_dir: /var/www
    volumes:
      - ./src:/var/www
      - mail_attachment_storage:/var/www/storage/app/private/mail/attachments
    depends_on:
      - pgsql
      - redis
    networks:
      - simpledesk

  queue_mail:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: simpledesk_queue_mail
    restart: unless-stopped
    working_dir: /var/www
    command: >-
      php artisan queue:work
      --queue=mail-incoming,mail-outgoing,default
      --sleep=1
      --tries=5
      --timeout=300
      --backoff=5
    volumes:
      - ./src:/var/www
      - mail_attachment_storage:/var/www/storage/app/private/mail/attachments
    depends_on:
      - pgsql
      - redis
    stop_grace_period: 330s
    networks:
      - simpledesk

  queue_antivirus:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: simpledesk_queue_antivirus
    restart: unless-stopped
    working_dir: /var/www
    command: >-
      php artisan queue:work
      --queue=mail-antivirus
      --sleep=1
      --tries=5
      --timeout=300
      --backoff=5
    volumes:
      - ./src:/var/www
      - mail_attachment_storage:/var/www/storage/app/private/mail/attachments
    depends_on:
      - pgsql
      - redis
    stop_grace_period: 330s
    networks:
      - simpledesk

  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: simpledesk_scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - ./src:/var/www
      - mail_attachment_storage:/var/www/storage/app/private/mail/attachments
    depends_on:
      - pgsql
      - redis
    stop_grace_period: 30s
    networks:
      - simpledesk

  nginx:
    image: nginx:1.27-alpine
    container_name: simpledesk_nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - simpledesk

  pgsql:
    image: postgres:16-alpine
    container_name: simpledesk_pgsql
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgsql_data:/var/lib/postgresql/data
    networks:
      - simpledesk

  redis:
    image: redis:7-alpine
    container_name: simpledesk_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - simpledesk

  mailpit:
    image: axllent/mailpit:latest
    container_name: simpledesk_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - simpledesk

  greenmail:
    image: greenmail/standalone:2.1.10
    container_name: simpledesk-greenmail
    restart: unless-stopped
    ports:
      - "3025:3025"
      - "3143:3143"
      - "8081:8080"
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=support:secret@simpledesk.test
        -Dgreenmail.users.login=email
        -Dgreenmail.verbose
    networks:
      - simpledesk

volumes:
  pgsql_data:
  redis_data:
  mail_attachment_storage:
    name: simpledesk_mail_attachment_storage

networks:
  simpledesk:
    driver: bridge
