services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: simpledesk_app
    working_dir: /var/www
    volumes:
      - ./src:/var/www
      - mail_attachment_storage:/var/www/storage/app/private/mail/attachments
    depends_on:
      - pgsql
      - redis
    networks:
      - simpledesk

  reverb:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: simpledesk_reverb
    restart: unless-stopped
    init: true
    working_dir: /var/www
    command:
      - php
      - artisan
      - reverb:start
      - --host=0.0.0.0
      - --port=8080
    env_file:
      - .env.reverb
    volumes:
      - ./src:/var/www
    depends_on:
      - pgsql
      - redis
    healthcheck:
      test: ["CMD", "php", "-r", "if (@fsockopen('127.0.0.1', 8080) === false) { exit(1); } exit(0);"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s
    networks:
      - simpledesk

  queue_mail:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: simpledesk_queue_mail
    restart: unless-stopped
    working_dir: /var/www
    command: >-
      php artisan queue:work
      --queue=mail-incoming,mail-outgoing,default
      --sleep=1
      --tries=5
      --timeout=300
      --backoff=5
    volumes:
      - ./src:/var/www
      - mail_attachment_storage:/var/www/storage/app/private/mail/attachments
    depends_on:
      - pgsql
      - redis
    stop_grace_period: 330s
    networks:
      - simpledesk

  queue_antivirus:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: simpledesk_queue_antivirus
    restart: unless-stopped
    working_dir: /var/www
    command: >-
      php artisan queue:work
      --queue=mail-antivirus
      --sleep=1
      --tries=5
      --timeout=300
      --backoff=5
    volumes:
      - ./src:/var/www
      - mail_attachment_storage:/var/www/storage/app/private/mail/attachments
    depends_on:
      - pgsql
      - redis
    stop_grace_period: 330s
    networks:
      - simpledesk

  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: simpledesk_scheduler
    restart: unless-stopped
    working_dir: /var/www
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          php artisan schedule:run --no-interaction
          sleep 60
        done
    volumes:
      - ./src:/var/www
      - mail_attachment_storage:/var/www/storage/app/private/mail/attachments
    depends_on:
      - pgsql
      - redis
    stop_grace_period: 30s
    networks:
      - simpledesk

  nginx:
    image: nginx:1.27-alpine
    container_name: simpledesk_nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_started
      reverb:
        condition: service_healthy
    networks:
      - simpledesk

  pgsql:
    image: postgres:16-alpine
    container_name: simpledesk_pgsql
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgsql_data:/var/lib/postgresql/data
    networks:
      - simpledesk

  redis:
    image: redis:7-alpine
    container_name: simpledesk_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - simpledesk

  meilisearch:
    image: getmeili/meilisearch:v1.53.1
    container_name: simpledesk_meilisearch
    restart: unless-stopped
    env_file:
      - src/.env.meilisearch
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - simpledesk

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: simpledesk_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - src/.env.minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - simpledesk

  minio_init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: simpledesk_minio_init
    env_file:
      - src/.env.minio
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
    command:
      - >
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done;
        mc mb --ignore-existing "local/$$MINIO_BUCKET";
        mc stat "local/$$MINIO_BUCKET";
    networks:
      - simpledesk

  mailpit:
    image: axllent/mailpit:latest
    container_name: simpledesk_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - simpledesk

  greenmail:
    image: greenmail/standalone:2.1.10
    container_name: simpledesk-greenmail
    restart: unless-stopped
    ports:
      - "3025:3025"
      - "3143:3143"
      - "8081:8080"
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=support:secret@simpledesk.test
        -Dgreenmail.users.login=email
        -Dgreenmail.verbose
    networks:
      - simpledesk

volumes:
  pgsql_data:
  redis_data:
  meilisearch_data:
  minio_data:
  mail_attachment_storage:
    name: simpledesk_mail_attachment_storage

networks:
  simpledesk:
    driver: bridge